name: Fetch LemonRealm M3U

on:
  schedule:
    - cron: "0 4 * * *" 
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y chromium-browser chromium-chromedriver
        pip install selenium requests

    - name: Run lemonrealm_fetch.py
      run: python lemonrealm_fetch.py

    - name: Commit and Push Changes
      env:
        TOKEN: ${{ secrets.GH_PAT }}
      run: |
        git config user.name "Jamesh6210"
        git config user.email "adidassport2016@gmail.com"
        git add -A
        git commit -m "Auto-updated M3U" || echo "No changes to commit"
        git remote set-url origin https://x-access-token:${TOKEN}@github.com/Jamesh6210/daily-iptv.git
        git push origin main
